<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince Social</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#171717;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:white;
  padding-bottom:75px;
}

/* Header */
.header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:white;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:800;
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  -webkit-background-clip:text;
  color:transparent;
}

.search{
  font-size:23px;
}

/* Stories */
.stories{
  display:flex;
  gap:13px;
  overflow-x:auto;
  padding:16px;
  border-bottom:1px solid #eee;
}

.story{
  min-width:65px;
  text-align:center;
  font-size:11px;
}

.story-img{
  width:58px;
  height:58px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(45deg,#7c3aed,#ec4899,#f59e0b);
  margin:auto;
}

.story-img div{
  width:100%;
  height:100%;
  border-radius:50%;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

/* Post */
.post{
  margin:15px;
  border:1px solid #eee;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.user{
  display:flex;
  align-items:center;
  padding:13px;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
}

.username{
  font-weight:bold;
}

.time{
  font-size:11px;
  color:#888;
}

.post-text{
  padding:0 14px 13px;
  line-height:1.4;
}

.photo{
  height:330px;
  background:linear-gradient(135deg,#dbeafe,#e9d5ff,#fce7f3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

.actions{
  display:flex;
  gap:22px;
  padding:13px 15px;
  font-size:26px;
}

.like{
  cursor:pointer;
  transition:.2s;
}

.like.active{
  transform:scale(1.2);
}

.likes{
  padding:0 15px 13px;
  font-size:13px;
  font-weight:bold;
}

/* Bottom Navigation */
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav{
  text-align:center;
  font-size:22px;
}

.nav small{
  display:block;
  font-size:10px;
  margin-top:3px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">Prince Social</div>
    <div class="search">⌕</div>
  </div>

  <div class="stories">

    <div class="story">
      <div class="story-img"><div>+</div></div>
      <div>Your Story</div>
    </div>

    <div class="story">
      <div class="story-img"><div>😎</div></div>
      <div>Prince</div>
    </div>

    <div class="story">
      <div class="story-img"><div>🎵</div></div>
      <div>Music</div>
    </div>

    <div class="story">
      <div class="story-img"><div>🔥</div></div>
      <div>Friends</div>
    </div>

    <div class="story">
      <div class="story-img"><div>✨</div></div>
      <div>Creator</div>
    </div>

  </div>

  <div class="post">

    <div class="likes">

  </div>

</div>

<div id="createBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; padding:20px;">
  <div style="background:white; max-width:450px; margin:80px auto; padding:20px; border-radius:20px;">
    <h2>Create Post</h2>

    <textarea id="postInput" placeholder="What's on your mind?"
      style="width:100%; height:120px; padding:12px; border:1px solid #ddd; border-radius:12px; font-size:16px; box-sizing:border-box;"></textarea>

    <button onclick="createPost()"
      style="margin-top:12px; width:100%; padding:12px; border:0; border-radius:12px; background:#7c3aed; color:white; font-size:16px;">
      Post
    </button>

    <button onclick="closeCreate()"
      style="margin-top:8px; width:100%; padding:12px; border:1px solid #ddd; border-radius:12px; background:white; font-size:16px;">
      Cancel
    </button>
  </div>
</div>
<div class="bottom">

  <div class="nav">⌂<small>Home</small></div>
  <div class="nav">⌕<small>Search</small></div>
  <div class="nav">＋<small>Create</small></div>
  <div class="nav">♡<small>Activity</small></div>
  <div class="nav">◉<small>Profile</small></div>

</div>
